[project]
name = "reachy-motion-generator"
version = "1.4.0"
description = "State-aware Reachy Mini motion: gesture intent planner and bounded residual trajectory generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.6",
    "huggingface-hub>=0.24",
    "transformers==5.23.0",
    "peft==0.21.3",
    "reachy-mini-rust-kinematics>=1.0.3",
]

[project.optional-dependencies]
serve = ["vllm==0.30.0", "fastapi", "uvicorn", "ninja"]
render = ["mujoco==3.3.0", "imageio[ffmpeg]>=2.34", "pillow>=10", "reachy-mini>=1.10"]
teacher = ["openai>=1.40"]
train = ["unsloth", "trl", "datasets", "peft"]

[project.scripts]
reachy-motion = "inference.pipeline:main"
reachy-motion-legacy = "inference.legacy_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "planner", "planner.distill", "generator", "renderer", "inference"]

[tool.setuptools.package-data]
common = ["assets/*.json"]
planner = ["examples/*", "intent_defaults.json", "intent_examples.json"]
inference = ["default_pipeline.json", "recipe_pipeline.json"]
